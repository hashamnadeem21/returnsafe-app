plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.receipttext'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.receipttext"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled Latin text recognition model: works offline on first use.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
