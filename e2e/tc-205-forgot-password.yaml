# TC-205: reset with an unknown email shows the same neutral message as for a known email.
appId: com.returnsafe.app
name: TC-205 Forgot password is neutral
---
- runScript:
    file: scripts/create-account.js
    env:
      PREFIX: tc205
- runFlow: subflows/fresh-welcome.yaml
- runFlow: subflows/open-log-in.yaml
- tapOn:
    id: login-forgot
- tapOn:
    id: forgot-email
- inputText: unknown-${output.email}
# Tap the title to close the keyboard (hideKeyboard can tap a button on iOS).
- tapOn:
    id: screen-forgot-password-title
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible: 'If an account exists for unknown-${output.email}, we sent a link to reset your password.'
    timeout: 20000
- assertVisible: 'Resend in .*'
- takeScreenshot: tc205-unknown-email
- tapOn:
    id: forgot-back
- tapOn:
    id: login-forgot
- tapOn:
    id: forgot-email
- eraseText: 120
- inputText: ${output.email}
# Tap the title to close the keyboard (hideKeyboard can tap a button on iOS).
- tapOn:
    id: screen-forgot-password-title
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible: 'If an account exists for ${output.email}, we sent a link to reset your password.'
    timeout: 20000
