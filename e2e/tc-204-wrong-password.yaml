# TC-204: log in with a wrong password -> "Email or password is incorrect"; the email stays filled in.
appId: com.returnsafe.app
name: TC-204 Wrong password
---
- runScript:
    file: scripts/create-account.js
    env:
      PREFIX: tc204
- runFlow: subflows/fresh-welcome.yaml
- runFlow: subflows/open-log-in.yaml
- tapOn:
    id: login-email
- inputText: ${output.email}
- tapOn:
    id: login-password
- inputText: 'Wrong999'
# Tap the title to close the keyboard (hideKeyboard can tap a button on iOS).
- tapOn:
    id: screen-log-in-title
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: 'Email or password is incorrect'
    timeout: 20000
- assertVisible:
    id: login-email
    text: '.*${output.email}'
- takeScreenshot: tc204-wrong-password
# The same message for an email with no account (reopen Log in for an empty form).
- tapOn:
    id: header-back
- runFlow: subflows/open-log-in.yaml
- tapOn:
    id: login-email
- inputText: nobody-${output.email}
- tapOn:
    id: login-password
- inputText: 'Wrong999'
# Tap the title to close the keyboard (hideKeyboard can tap a button on iOS).
- tapOn:
    id: screen-log-in-title
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: 'Email or password is incorrect'
    timeout: 20000
