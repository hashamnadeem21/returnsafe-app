<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReturnSafe App Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@page { size: 1400px 1040px; margin: 0; }
:root{
  --primary:#0F766E; --primaryPressed:#115E59; --primarySoft:#CCFBF1; --primaryLine:#99F6E4;
  --warning:#F59E0B; --warningText:#B45309; --warningSoft:#FEF3C7;
  --danger:#DC2626; --dangerSoft:#FEE2E2; --success:#16A34A; --successSoft:#DCFCE7;
  --ink:#0F172A; --ink2:#475569; --muted:#94A3B8; --border:#E2E8F0; --bg:#F8FAFC; --surface:#FFFFFF;
}
.dark{
  --primary:#2DD4BF; --primaryPressed:#14B8A6; --primarySoft:#134E4A; --primaryLine:#115E59;
  --warning:#FBBF24; --warningText:#FBBF24; --warningSoft:#422006;
  --danger:#F87171; --dangerSoft:#450A0A; --success:#4ADE80; --successSoft:#052E16;
  --ink:#F1F5F9; --ink2:#94A3B8; --muted:#64748B; --border:#1F2937; --bg:#0B1220; --surface:#111827;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9EEF3}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased}
.page{width:1400px;height:1040px;background:#EEF2F6;position:relative;overflow:hidden;page-break-after:always;padding:30px 56px}
.page:last-child{page-break-after:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.ph h2{font-size:26px;font-weight:800;letter-spacing:-.5px}
.ph .sec{font-size:13px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.ph .pn{font-size:13px;color:#64748B}
.row3{display:flex;justify-content:space-between}
.cell{width:399px;display:flex;flex-direction:column;align-items:center}
.cap{width:399px;margin-top:14px}
.cap b{font-size:15px;display:block;margin-bottom:3px}
.cap b span{display:inline-block;background:#0F766E;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:2px}
.cap b em{font-style:normal;font-size:11px;color:#475569;background:#fff;border:1px solid #CBD5E1;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.cap p{font-size:12.5px;color:#475569;line-height:1.45}

/* phone */
.phone{width:375px;height:812px;border:11px solid #0B1220;border-radius:54px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);box-shadow:0 18px 40px rgba(15,23,42,.18);flex:none;box-sizing:content-box}
.phone.android{border-radius:38px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.sb{height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600;flex:none;position:relative;z-index:5}
.android .sb{height:36px;padding:2px 22px 0 22px;font-size:13px;font-weight:500}
.island{position:absolute;left:50%;top:10px;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px}
.punch{position:absolute;left:50%;top:9px;width:16px;height:16px;margin-left:-8px;background:#000;border-radius:50%}
.sbi{display:flex;gap:5px;align-items:center}
.homeind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:var(--ink);border-radius:3px;opacity:.9;z-index:6}
.android .homeind{width:108px;height:4px;margin-left:-54px;bottom:7px;opacity:.55}
.content{flex:1;overflow:hidden;padding:0 20px;position:relative}
.tabbar{height:84px;flex:none;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;position:relative}
.android .tabbar{height:78px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);width:64px}
.tab.on{color:var(--primary);font-weight:600}
.tab .fab{width:56px;height:56px;border-radius:28px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 14px rgba(15,118,110,.35);border:4px solid var(--surface)}
.dark .tab .fab{box-shadow:none}

/* type */
.t-display{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.4px}
.t-title{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.2px}
.t-head{font-size:17px;line-height:22px;font-weight:600}
.t-body{font-size:16px;line-height:22px}
.t-cap{font-size:13px;line-height:18px;color:var(--ink2)}
.t-label{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.muted{color:var(--ink2)}

/* components */
.btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;width:100%}
.btn.primary{background:var(--primary);color:#fff}
.dark .btn.primary{color:#04201D}
.btn.secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--ink)}
.btn.soft{background:var(--primarySoft);color:var(--primaryPressed)}
.dark .btn.soft{color:var(--primary)}
.btn.text{color:var(--primary);height:44px}
.btn.danger{background:var(--danger);color:#fff}
.btn.disabled{background:var(--border);color:var(--muted)}
.btn.apple{background:#000;color:#fff}
.btn.google{background:#fff;color:#1F1F1F;border:1.5px solid #DADCE0}
.field{margin-bottom:14px}
.field .lbl{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.input{height:52px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);display:flex;align-items:center;padding:0 14px;font-size:16px;gap:10px;justify-content:space-between}
.input.focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.input.error{border-color:var(--danger)}
.input .ph2{color:var(--muted)}
.help{font-size:12.5px;color:var(--ink2);margin-top:6px}
.err{font-size:12.5px;color:var(--danger);margin-top:6px;display:flex;gap:6px;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.chip{height:34px;border-radius:17px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.dark .chip.on{color:#04201D}
.chip .n{opacity:.7}
.pill{height:26px;border-radius:13px;padding:0 10px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.red{background:var(--dangerSoft);color:var(--danger)}
.pill.amber{background:var(--warningSoft);color:var(--warningText)}
.pill.gray{background:var(--bg);color:var(--ink2);border:1px solid var(--border)}
.pill.green{background:var(--successSoft);color:var(--success)}
.pill.teal{background:var(--primarySoft);color:var(--primaryPressed)}
.dark .pill.teal{color:var(--primary)}
.av{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.lrow+.lrow{border-top:1px solid var(--border)}
.lrow .mid{flex:1;min-width:0}
.lrow .nm{font-size:15.5px;font-weight:600}
.lrow .sub{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sechd{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sechd .a{font-size:14px;color:var(--primary);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:19px}
.banner.warn{background:var(--warningSoft);color:#78350F}
.banner.info{background:var(--primarySoft);color:#134E4A}
.banner.off{background:#1E293B;color:#F1F5F9}
.nav{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none}
.nav .ttl{font-size:17px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px 34px;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:4}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 14px}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:3}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--primary);position:relative;flex:none}
.toggle:after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.offt{background:var(--border)}
.toggle.offt:after{right:auto;left:2px}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid var(--border);flex:none}
.radio.on{border:7px solid var(--primary)}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--primaryPressed);background:var(--primarySoft);padding:3px 7px;border-radius:6px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border)}
.dots i.on{width:24px;background:var(--primary)}
.skel{background:linear-gradient(90deg,var(--border),#F1F5F9);border-radius:8px}
.kb{position:absolute;left:0;right:0;bottom:0;height:300px;background:#D1D5DB;z-index:4;display:flex;flex-direction:column;gap:10px;padding:10px 4px 0}
.kb .k{display:flex;gap:6px;justify-content:center}
.kb .k span{background:#fff;border-radius:5px;height:42px;width:32px;box-shadow:0 1px 0 #9CA3AF;font-size:20px;display:flex;align-items:center;justify-content:center;color:#111}

/* brand pages */
.sw{width:150px}
.sw .c{height:84px;border-radius:14px;border:1px solid rgba(0,0,0,.06)}
.sw b{display:block;font-size:13px;margin-top:8px}
.sw span{font-size:12px;color:#475569}
.panel{background:#fff;border-radius:20px;padding:26px;border:1px solid #E2E8F0}
.panel h3{font-size:15px;font-weight:700;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;color:#475569}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- icons ----------
const P = {
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 receipt:'<path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
 scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 bell:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/>',
 bellOff:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4M3 3l18 18"/>',
 right:'<path d="M9 6l6 6-6 6"/>', left:'<path d="M15 6l-6 6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
 arrowLeft:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 flash:'<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
 image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 17l5-5 4 4 3-3 6 6"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 more:'<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 alert:'<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2h.01"/>',
 wifiOff:'<path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 4.3-2.4M19 12.6a10 10 0 0 0-2.6-1.8M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5M12 20h.01"/>',
 export:'<path d="M12 15V3M7 8l5-5 5 5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>',
 doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 restore:'<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 tag:'<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
 dollar:'<path d="M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.8 7 7s2 3 5 3.5 5 1.5 5 3.8-2.3 3.7-5 3.7-5-1.1-5-3"/>',
 card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 logout:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/>',
 store:'<path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/>',
 sync:'<path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18 3v4h-4M6 21v-4h4"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
 back:'<path d="M15 6l-6 6 6 6"/>',
};
const I=(n,s=22,c='currentColor',w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${P[n]}</svg>`;
const mark=(s=64)=>`<img src="../brand/logo-mark.svg" width="${s}" height="${s}" style="display:block;border-radius:${s*0.22}px">`;
const G=`<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>`;

// ---------- chrome ----------
const sbIOS=(light)=>`<div class="sb" style="${light?'color:#fff':''}"><span>9:41</span><div class="island"></div><div class="sbi"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5c2.3 0 4.4.9 5.9 2.4l1.1-1.1A9.8 9.8 0 0 0 8 1 9.8 9.8 0 0 0 1 3.8l1.1 1.1A8.3 8.3 0 0 1 8 2.5zm0 3c1.5 0 2.8.6 3.8 1.5l1.1-1.1A6.9 6.9 0 0 0 8 4a6.9 6.9 0 0 0-4.9 1.9L4.2 7A5.4 5.4 0 0 1 8 5.5zm0 3c.7 0 1.3.3 1.8.7L8 11 6.2 9.2c.5-.4 1.1-.7 1.8-.7z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><rect x="24" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/></svg></div></div>`;
const sbAnd=(light)=>`<div class="sb" style="${light?'color:#fff':''}"><span>12:30</span><div class="punch"></div><div class="sbi"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M7 2.5c2.2 0 4.2.8 5.7 2.2L7 12 1.3 4.7A8.4 8.4 0 0 1 7 2.5z"/></svg><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M13 1v12H1z"/></svg><svg width="9" height="15" viewBox="0 0 9 15" fill="currentColor"><rect x="2.5" y="0" width="4" height="2" rx=".5"/><rect x="0" y="1.5" width="9" height="13.5" rx="1.5"/></svg></div></div>`;
const sb=(p,light)=>p==='android'?sbAnd(light):sbIOS(light);
const tabbar=(on)=>{const t=[['home','Home'],['receipt','Receipts'],['scan','Scan'],['shield','Warranties'],['gear','Settings']];
 return `<div class="tabbar">${t.map(([i,l])=>i==='scan'?`<div class="tab"><div class="fab">${I('scan',26,'#fff',2.2)}</div><span style="margin-top:2px">Scan</span></div>`:`<div class="tab ${on===i?'on':''}">${I(i,24,'currentColor',on===i?2.3:1.9)}<span>${l}</span></div>`).join('')}</div>`;};
const phone=(inner,{p='ios',dark=false,lightBar=false,bg}={})=>`<div class="phone ${p} ${dark?'dark':''}"><div class="scr" style="${bg?`background:${bg}`:''}">${sb(p,lightBar)}${inner}</div><div class="homeind" style="${lightBar?'background:#fff':''}"></div></div>`;
const nav=(title,{left='back',right=''}={})=>`<div class="nav"><div class="iconbtn">${left==='back'?I('back',26):left==='x'?I('x',24):left==='arrow'?I('arrowLeft',24):''}</div><div class="ttl">${title}</div><div class="iconbtn">${right}</div></div>`;

 ['Login and signup','Email flows',[[S.signup,'S04','Sign up','Name optional. Password rule shown before the user makes a mistake. Show/hide eye on the password.'],[S.login,'S05','Log in · error state','One generic error for a wrong email or password, so the app never reveals which emails are registered.'],[S.forgot,'S06','Forgot password · sent','Neutral confirmation for any email. Resend unlocks after 60 seconds.']]],
